name: Soroban Smart Contracts CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'smart-contracts/**'
      - '.github/workflows/soroban.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'smart-contracts/**'
      - '.github/workflows/soroban.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: |
          cd smart-contracts
          cargo fmt -- --check

  clippy:
    name: Clippy (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          target: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: smart-contracts/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: |
          cd smart-contracts
          cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: smart-contracts/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: |
          cd smart-contracts
          cargo test --all-features -- --nocapture

  build:
    name: Build Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: smart-contracts/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Soroban CLI
        run: |
          cargo install --locked soroban-cli --features opt

      - name: Build contracts
        run: |
          cd smart-contracts
          cargo build --release --target wasm32-unknown-unknown

      - name: Optimize contracts
        run: |
          cd smart-contracts
          for contract in contracts/*; do
            if [ -d "$contract" ]; then
              contract_name=$(basename $contract)
              wasm_file="target/wasm32-unknown-unknown/release/${contract_name}.wasm"
              if [ -f "$wasm_file" ]; then
                echo "Optimizing $contract_name..."
                soroban contract optimize --wasm "$wasm_file"
              fi
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimized-contracts
          path: |
            smart-contracts/target/wasm32-unknown-unknown/release/*.wasm
            smart-contracts/target/wasm32-unknown-unknown/release/*.optimized.wasm
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: |
          cd smart-contracts
          cargo audit

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: |
          cd smart-contracts
          cargo tarpaulin --out Xml --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./smart-contracts/coverage/cobertura.xml
          flags: soroban
          name: soroban-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  size-check:
    name: Contract Size Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: smart-contracts/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts
        run: |
          cd smart-contracts
          cargo build --release --target wasm32-unknown-unknown

      - name: Check contract sizes
        run: |
          cd smart-contracts
          echo "Contract sizes:"
          echo "---------------"
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$wasm" ]; then
              size=$(stat -c%s "$wasm")
              name=$(basename "$wasm")
              echo "$name: $size bytes"
              
              # Warn if contract exceeds 100KB
              if [ "$size" -gt 102400 ]; then
                echo "::warning::Contract $name exceeds 100KB ($size bytes)"
              fi
            fi
          done

  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [format, clippy, test, build]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install Soroban CLI
        run: |
          cargo install --locked soroban-cli --features opt

      - name: Build and optimize contracts
        run: |
          cd smart-contracts
          cargo build --release --target wasm32-unknown-unknown
          
          for contract in contracts/*; do
            if [ -d "$contract" ]; then
              contract_name=$(basename $contract)
              wasm_file="target/wasm32-unknown-unknown/release/${contract_name}.wasm"
              if [ -f "$wasm_file" ]; then
                echo "Optimizing $contract_name..."
                soroban contract optimize --wasm "$wasm_file"
              fi
            fi
          done

      - name: Deploy to testnet
        env:
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          SOROBAN_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: |
          cd smart-contracts
          echo "Deployment would happen here with proper secrets configured"
          echo "Contracts built and optimized successfully"
          # In production, deploy with: soroban contract deploy --wasm ...

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [format, clippy, test, build, security-audit]
    steps:
      - name: All checks passed
        run: echo "All Soroban CI checks passed!"
