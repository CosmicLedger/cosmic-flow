[package]
name = "stellar-chain-indexer"
version = "1.0.0"
edition = "2021"
authors = ["CosmicLedger Team <contact@cosmicledger.io>"]
description = "High-performance Stellar blockchain indexer and API server"
license = "Apache-2.0"
repository = "https://github.com/CosmicLedger/stellar-chain-explorer"

[dependencies]
# Web framework
actix-web = "4.9"
actix-rt = "2.10"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "migrate"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration
dotenv = "0.15"
config = "0.14"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Stellar SDK
stellar-base = "0.1"

# Caching
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Metrics
prometheus = "0.13"

# Rate limiting
governor = "0.7"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
actix-web-test = "0.1"
mockito = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
